[package]
name = "projetos-integradores"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
arrow = "58.0.0"
arrow-schema = "58.0.0"
bincode = "1.3.3"
clap = { version = "4.5.48", features = ["derive"] }
csv = "1.4.0"
half = { version = "2.4.1", features = ["serde"] }
hnsw_rs = "0.3.4"
memmap2 = "0.9.5"
parquet = "58.0.0"
polars = { version = "0.55.2", features = ["csv", "lazy", "parquet"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "time"] }

[dev-dependencies]
tempfile = "3.23.0"
