[package]
name = "machine-learning"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "exercicio_candle_vs_ort"
path = "solucao/exercicio_candle_vs_ort.rs"

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11.0"
candle-nn = "0.11.0"
clap = { version = "4.5.48", features = ["derive"] }
linfa = "0.8.1"
linfa-linear = "0.8.1"
linfa-logistic = "0.8.1"
ndarray = "0.16.1"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
polars = { version = "0.55.2", features = ["csv", "lazy", "parquet"] }
rand = "0.8.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
