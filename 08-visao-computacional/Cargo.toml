[package]
name = "visao-computacional"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "exercicio_video_detection"
path = "solucao/exercicio_video_detection.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.48", features = ["derive"] }
csv = "1.4.0"
image = "0.25.8"
imageproc = "0.25.0"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
serde = { version = "1.0.219", features = ["derive"] }

[dependencies.opencv]
version = "0.97.2"
optional = true

[dev-dependencies]
tempfile = "3.23.0"

[features]
opencv = ["dep:opencv"]
