[package]
name = "visualizacao-dados"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "exercicio_dashboard_streaming"
path = "solucao/exercicio_dashboard_streaming.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"] }
csv = "1.4.0"
eframe = "0.32"
egui = "0.32"
plotters = "0.3.7"
polars = { version = "0.55.2", features = ["csv", "lazy", "parquet"] }
rand = "0.8.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "3.23.0"
