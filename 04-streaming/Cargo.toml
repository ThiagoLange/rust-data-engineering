[package]
name = "streaming"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "exercicio_backpressure"
path = "solucao/exercicio_backpressure.rs"

[dependencies]
anyhow = "1.0.104"
arrow = "58.0.0"
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"] }
parquet = "58.0.0"
rand = "0.8.5"
rdkafka = { version = "0.38.0", features = ["tokio"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-stream = "0.1.17"
