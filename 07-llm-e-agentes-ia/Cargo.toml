[package]
name = "llm-e-agentes-ia"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "exercicio_double_embeddings"
path = "solucao/exercicio_double_embeddings.rs"

[dependencies]
anyhow = "1.0.104"
async-openai = "0.28.0"
clap = { version = "4.5.48", features = ["derive"] }
hnsw_rs = "0.3.4"
reqwest = { version = "0.12.15", features = ["json"] }
schemars = { version = "0.8.22", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs"] }
