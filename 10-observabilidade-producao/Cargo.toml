[package]
name = "observabilidade-producao"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "instrumented_pipeline"
path = "src/bin/instrumented_pipeline.rs"

[[bin]]
name = "exercicio_proptest_parser"
path = "solucao/exercicio_proptest_parser.rs"

[[bench]]
name = "pipeline_bench"
harness = false

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
polars = { version = "0.55.2", features = ["csv", "lazy"] }
proptest = "1.7.0"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[dependencies.tracing-opentelemetry]
version = "0.28.0"
optional = true

[dependencies.opentelemetry]
version = "0.28.0"
optional = true

[dependencies.opentelemetry-otlp]
version = "0.28.0"
optional = true

[features]
otel = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry-otlp"]
